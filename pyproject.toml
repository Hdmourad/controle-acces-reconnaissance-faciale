[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-acces-reconnaissance-faciale"
version = "0.1.0"
description = "Systeme de controle d'acces par reconnaissance faciale a base de Raspberry Pi"
authors = [
    { name = "Mourad HADJI" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]